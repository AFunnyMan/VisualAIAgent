[project]
name = "visual-ai-agent"
version = "0.1.0"
description = "Local visual memory with a single tool-calling agent"
requires-python = ">=3.11,<3.12"
dependencies = [
  "openai-agents>=0.2,<1",
  "opencv-python>=4.11,<5",
  "onnxruntime>=1.20,<2",
  "supervision>=0.25,<1",
  "streamlit>=1.40,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "tzdata>=2025.1",
  "psutil>=6,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
export = ["ultralytics>=8.4,<9", "onnx>=1.17,<2", "onnxslim>=0.1,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visual_ai_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live_api and not camera"'
markers = ["live_api: explicitly enabled paid real model calls", "camera: requires real camera and manual scene"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
