[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#147D73"
backgroundColor = "#F5F6F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#20312E"
baseRadius = "medium"
buttonRadius = "medium"
borderColor = "#DDE4E1"
showWidgetBorder = true

[runner]
# Frequent fragments share a process with real-time vision. Keep Python's
# automatic GC, but avoid a forced full-heap collection after every UI rerun.
postScriptGC = false
